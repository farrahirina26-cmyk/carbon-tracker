<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carbon Footprint Tracker</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* সতেজ ও সুন্দর প্রকৃতির ব্যাকগ্রাউন্ড (উজ্জ্বল ফরেস্ট ও রোদ) */
    .hero-section {
      position: relative;
      height: 100vh;
      background: linear-gradient(rgba(10, 30, 20, 0.4), rgba(10, 30, 20, 0.4)), 
                  url('https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }

    /* ভাসমান (Floating) অ্যানিমেশন */
    @keyframes floatEffect {
      0% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
      100% {
        transform: translateY(0px);
      }
    }

    /* ব্যাকগ্রাউন্ডের সাথে নিখুঁতভাবে ম্যাচিং করা প্রিমিয়াম গ্লাসমরফিজম কার্ড */
    .glass-card {
      animation: floatEffect 4s ease-in-out infinite;
      /* স্বচ্ছতা বাড়িয়ে এবং ফরেস্ট টোনের সাথে মিলিয়ে সফট ডার্ক-গ্রিন গ্লাস ইফেক্ট দেওয়া হয়েছে */
      background: rgba(12, 30, 20, 0.35); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 45px 35px;
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      max-width: 520px;
      width: 90%;
    }

    .brand-title {
      font-size: 2.3rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .brand-title span {
      color: #2ecc71; /* সজীব সবুজ হাইলাইট */
    }

    .brand-subtitle {
      font-size: 0.95rem;
      color: #e2e8f0;
      margin-bottom: 30px;
      line-height: 1.5;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    /* লগইন বাটন */
    .btn-custom-login {
      background-color: #198754;
      color: white;
      padding: 10px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      border: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(25, 135, 84, 0.4);
      text-decoration: none;
    }

    .btn-custom-login:hover {
      background-color: #157347;
      transform: scale(1.05);
      color: white;
    }

    /* রেজিস্টার বাটন */
    .btn-custom-register {
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
      padding: 10px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      transition: all 0.3s ease;
      text-decoration: none;
      backdrop-filter: blur(4px);
    }

    .btn-custom-register:hover {
      background-color: rgba(255, 255, 255, 0.25);
      color: white;
      transform: scale(1.05);
      border-color: #fff;
    }
  </style>
</head>
<body>

  <div class="hero-section">
    <div class="glass-card">
      <div class="mb-3">
        <i class="fa-solid fa-earth-americas text-success" style="font-size: 3rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));"></i>
      </div>
      <h1 class="brand-title">Carbon <span>Footprint</span> Tracker</h1>
      <p class="brand-subtitle">Manage your household energy usage and travel emissions effortlessly. Build a sustainable future for our planet.</p>
      
      <div class="d-flex justify-content-center gap-3 flex-wrap">
        <a href="public/login.html" class="btn-custom-login">
          <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
        </a>
        <a href="public/login.html" class="btn-custom-register">
          <i class="fa-solid fa-user-plus me-2"></i> Register
        </a>
      </div>
    </div>
  </div>

</body>
</html>


<!-- UI design and layout by Mariya -->
